# Nginx configuration for CNTXT R.E.D. System
# Hostinger VPS Deployment (Ubuntu)

server {
    listen 80;
    server_name centralcntxt.tech www.centralcntxt.tech;

    client_max_body_size 50M;
    charset utf-8;

    # Frontend Static & SPA Files (index.html, app.js, styles.css, etc.)
    root /var/www/cntxt;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Frontend SPA Route Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django Static Files (Collectstatic output)
    location /static/ {
        alias /var/www/cntxt/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Django Media Files (Uploads, Avatars, Attachments)
    location /media/ {
        alias /var/www/cntxt/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Django REST API Backend Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts for heavy aggregations or queries
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Django Admin Panel Proxy
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
