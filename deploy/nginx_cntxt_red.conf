# Nginx configuration for CNTXT R.E.D. System
# Hostinger VPS Deployment

upstream cntxt_red_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name red.cntxt.co _;

    # Redirigir todo el tráfico HTTP a HTTPS en producción
    # return 301 https://$host$request_uri;

    client_max_body_size 25M;
    charset utf-8;

    # Archivos estáticos Django y Frontend
    location /static/ {
        alias /var/www/cntxt_red/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Archivos multimedia subidos (avatares, adjuntos)
    location /media/ {
        alias /var/www/cntxt_red/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy hacia Gunicorn (Django Backend & API)
    location / {
        proxy_pass http://cntxt_red_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts para operaciones de sincronización y seed
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
