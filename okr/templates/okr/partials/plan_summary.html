<div id="plan-summary-{{ plan.id }}" class="mb-8">
  {% if plan.summary_text %}
  <div class="border border-cntxt-border rounded-2xl bg-cntxt-card p-5 mb-4">
    <div class="font-mono text-[9px] uppercase tracking-wider text-cntxt-muted mb-2">Objetivo del ciclo</div>
    <p class="text-[13px] text-cntxt-muted leading-relaxed">{{ plan.summary_text }}</p>
  </div>
  {% endif %}
  {% if view_mode == 'edicion' %}
  <button type="button" hx-get="/plans/{{ plan.id }}/edit/" hx-target="#plan-edit-slot-{{ plan.id }}" hx-swap="innerHTML"
    class="text-[11px] font-mono uppercase tracking-wide px-3 py-1 rounded-lg border border-cntxt-border text-cntxt-muted hover:text-cntxt-gold hover:border-cntxt-gold/40 transition">Editar descripción del sistema</button>
  <div id="plan-edit-slot-{{ plan.id }}" class="mt-3"></div>
  {% endif %}
</div>
