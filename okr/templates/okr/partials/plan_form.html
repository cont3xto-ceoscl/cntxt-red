<div class="okr-inline-form border border-cntxt-gold/30 bg-cntxt-gold/[0.04] rounded-2xl p-4 space-y-3">
  <div class="text-[10px] font-mono uppercase tracking-wider text-cntxt-gold">Editar descripción — {{ plan.line.name }}</div>
  <form hx-post="{{ action_url }}" hx-target="{{ target }}" hx-swap="{{ swap }}" class="space-y-3">
    {% csrf_token %}
    {% include "okr/partials/_form_fields.html" %}
    <div class="flex items-center gap-3 pt-1">
      <button type="submit" class="text-[11px] font-mono uppercase tracking-wide px-3 py-1.5 rounded-lg bg-cntxt-gold/15 text-cntxt-gold border border-cntxt-gold/30 hover:bg-cntxt-gold/25">Guardar</button>
      <button type="button" onclick="this.closest('.okr-inline-form').remove()" class="text-[11px] font-mono uppercase tracking-wide px-3 py-1.5 rounded-lg border border-cntxt-border text-cntxt-muted hover:text-cntxt-text hover:border-cntxt-muted/60 transition">Cancelar</button>
    </div>
  </form>
</div>
