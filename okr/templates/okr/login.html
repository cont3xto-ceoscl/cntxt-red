{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar | CNTXT OKRs</title>
<link rel="stylesheet" href="{% static 'okr/css/fonts.css' %}">
<link rel="stylesheet" href="{% static 'okr/css/tailwind.css' %}">
</head>
<body class="bg-cntxt-dark min-h-screen flex items-center justify-center font-sans">
    <div class="w-full max-w-sm px-4">
        <div class="text-center mb-8">
            <h1 class="text-cntxt-gold font-bold text-3xl tracking-widest">CNTXT</h1>
            <p class="text-cntxt-muted text-sm mt-2">OKRs — normalmente entras por el <a href="{{ HUB_URL }}" class="text-cntxt-gold hover:underline">HUB</a>.</p>
        </div>
        <form method="post" class="bg-cntxt-card border border-cntxt-border rounded-xl p-8 space-y-6">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% if form.errors %}
            <div class="bg-red-900/30 border border-red-800 text-red-300 text-sm rounded-lg px-4 py-3">Usuario o contraseña inválidos.</div>
            {% endif %}
            <div>
                <label class="block text-sm text-cntxt-muted mb-2">Usuario</label>
                <input type="text" name="username" required autofocus class="w-full bg-cntxt-dark border border-cntxt-border rounded-lg px-4 py-3 text-cntxt-text focus:border-cntxt-gold focus:outline-none">
            </div>
            <div>
                <label class="block text-sm text-cntxt-muted mb-2">Contraseña</label>
                <input type="password" name="password" required class="w-full bg-cntxt-dark border border-cntxt-border rounded-lg px-4 py-3 text-cntxt-text focus:border-cntxt-gold focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-cntxt-gold text-cntxt-dark font-semibold py-3 rounded-lg hover:opacity-90 transition">Ingresar</button>
        </form>
    </div>
</body>
</html>
